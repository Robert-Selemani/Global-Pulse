<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global Pulse" />
    <meta property="og:title" content="Global Pulse - Map your community, live" />
    <meta property="og:description" content="Share a link or QR and watch a live world map fill with communities as people join - no login needed. Present it on the big screen." />
    <meta property="og:image" content="https://www.globalpulse.today/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="654" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Global Pulse - Map your community, live" />
    <meta name="twitter:description" content="Share a link or QR and watch a live world map fill with communities as people join - no login needed." />
    <meta name="twitter:image" content="https://www.globalpulse.today/og-image.jpg" />
    <title>Account - Global Pulse</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="app-sidebar"></div>
      <main class="app-main">
        <div class="app-main-inner">
          <h1 class="page-title">Account</h1>

          <section class="dash-card">
            <h2>Your details</h2>
            <p class="poll-meta">
              Email: <strong id="acct-email">-</strong>
            </p>
            <p class="poll-meta">
              Role: <strong id="acct-role">-</strong>
            </p>
            <p class="poll-meta">
              Plan: <strong id="acct-plan">-</strong>
            </p>
          </section>

          <section class="dash-card">
            <h2>Change password</h2>
            <form id="password-form" class="create-form" autocomplete="off">
              <label for="current-password">Current password</label>
              <input id="current-password" type="password" autocomplete="current-password" required />

              <label for="new-password">New password</label>
              <input id="new-password" type="password" autocomplete="new-password" minlength="6" required />

              <label for="new-password2">Confirm new password</label>
              <input id="new-password2" type="password" autocomplete="new-password" minlength="6" required />

              <p class="form-message" id="password-message" role="status"></p>
              <button type="submit" class="admin-btn" id="password-btn">Update password</button>
            </form>
          </section>
        </div>
      </main>
    </div>

    <script src="/app-nav.js"></script>
    <script src="/account.js"></script>
  </body>
</html>
