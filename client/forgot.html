<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global Pulse" />
    <meta property="og:title" content="Global Pulse - Map your community, live" />
    <meta property="og:description" content="Share a link or QR and watch a live world map fill with communities as people join - no login needed. Present it on the big screen." />
    <meta property="og:image" content="https://www.globalpulse.today/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="654" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Global Pulse - Map your community, live" />
    <meta name="twitter:description" content="Share a link or QR and watch a live world map fill with communities as people join - no login needed." />
    <meta name="twitter:image" content="https://www.globalpulse.today/og-image.jpg" />
    <title>Forgot password - Global Pulse</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-wrap">
      <div class="auth-card">
        <div class="brand center">
          <span class="pulse-dot" aria-hidden="true"></span>
          <h1>Global Pulse</h1>
        </div>
        <h2>Forgot your password?</h2>

        <p class="hint">
          Password resets are handled by your event organizer. Ask them to send
          you a one-time reset link, then open it to choose a new password.
        </p>
        <p class="hint">
          The link works once and expires after an hour, so request it when
          you're ready to use it.
        </p>

        <p class="auth-alt"><a href="/login">← Back to log in</a></p>
      </div>
    </main>
  </body>
</html>
