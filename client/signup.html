<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global Pulse" />
    <meta property="og:title" content="Global Pulse - Map your community, live" />
    <meta property="og:description" content="Share a link or QR and watch a live world map fill with communities as people join - no login needed. Present it on the big screen." />
    <meta property="og:image" content="https://www.globalpulse.today/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="654" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Global Pulse - Map your community, live" />
    <meta name="twitter:description" content="Share a link or QR and watch a live world map fill with communities as people join - no login needed." />
    <meta name="twitter:image" content="https://www.globalpulse.today/og-image.jpg" />
    <title>Sign up - Global Pulse</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-wrap">
      <form class="auth-card" id="signup-form" autocomplete="on">
        <div class="brand center">
          <span class="pulse-dot" aria-hidden="true"></span>
          <h1>Global Pulse</h1>
        </div>
        <h2>Create your account</h2>

        <div class="super-banner" id="first-user-banner" hidden>
          🎉 You're the first to sign up - you'll be the <strong>super admin</strong>.
        </div>

        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="username" required />

        <label for="auth-password">Password</label>
        <input
          id="auth-password"
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
        />
        <p class="field-hint">At least 6 characters.</p>

        <p class="form-message" id="auth-message" role="status"></p>
        <button type="submit" class="admin-btn full" id="auth-submit">Sign up</button>

        <p class="auth-alt">
          Already have an account? <a href="/login">Log in</a>
        </p>
        <p class="auth-alt"><a href="/present">← Back to results</a></p>
      </form>
    </main>

    <script src="/auth.js"></script>
  </body>
</html>
